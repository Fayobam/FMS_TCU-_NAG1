; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32doit-devkit-v1

[env:esp32doit-devkit-v1]
platform = https://github.com/pioarduino/platform-espressif32.git#51.03.04
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_compat_mode = strict
lib_ldf_mode = chain
lib_deps =
    ESP32Async/AsyncTCP @ 3.3.2
    ESP32Async/ESPAsyncWebServer @ 3.6.0
    bblanchon/ArduinoJson @ 7.4.3
; WiFi, AsyncTCP and dashboard services run on core 0. Core 1 owns physics.
; AsyncTCP priority 3 remains below ESP-IDF radio tasks; callbacks enqueue commands.
; Stack 8K: JSON is built on the Core 0 dashboard task, not in the TCP callback.
build_flags =
    ; AsyncTCP's idle feed interval is 1000 ms, incompatible with the 250 ms
    ; physics watchdog. Networking must not subscribe to the control watchdog.
    -D CONFIG_ASYNC_TCP_USE_WDT=0
    -D CONFIG_ASYNC_TCP_MAX_ACK_TIME=5000
    -D CONFIG_ASYNC_TCP_PRIORITY=3
    -D CONFIG_ASYNC_TCP_QUEUE_SIZE=64
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=0
    -D CONFIG_ASYNC_TCP_STACK_SIZE=8192
    -D WS_MAX_QUEUED_MESSAGES=16
board_build.filesystem = spiffs
; Single-app layout: reclaims the unused OTA slot (app 1.25->2 MB, spiffs 1.4->1.875 MB).
; NVS offset is unchanged, so stored calibration survives; SPIFFS moves, so run
; `pio run -t uploadfs` once after flashing this. See partitions_tcu.csv.
board_build.partitions = partitions_tcu.csv
; Bundle data/index.html + first-party CSS/JS into a self-contained gzip page.
; The full UI is embedded in firmware; no uploadfs or external library required.
extra_scripts = pre:extra_script.py

; ----------------------------------------------------------------------------
; HOST TEST ENV —  pio test -e native
; Compiles the control logic (scheduler + driver + cal + adaptation + DTC) against
; the shims in test/stubs/ and runs it on the PC. Deliberately EXCLUDES the
; hardware-bound units (main/WebManager/SpeedReader): those need real peripherals.
; InputManager is exercised with simulated GPIO/ADC; electrical thresholds still need a bench.
; `pio run` still builds only the ESP32 env (see default_envs above).
; ----------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
; Additional network/command host fixtures use tools/test_host.py and their own stubs.
test_filter = test_gear_control
test_build_src = yes
build_src_filter =
    -<*>
    +<ShiftScheduler.cpp>
    +<ShiftSelector.cpp>
    +<InputManager.cpp>
    +<AtfRangeObserver.cpp>
    +<ShiftPhases.cpp>
    +<ShiftCalibration.cpp>
    +<ShiftSafety.cpp>
    +<ShiftBench.cpp>
    +<SolenoidDriver.cpp>
    +<EngineProfile.cpp>
    +<AdaptiveMemory.cpp>
    +<DtcManager.cpp>
    +<TuneOverlay.cpp>
build_flags =
    -std=gnu++17
    -D UNIT_TEST
    -I src
    -I test/stubs
