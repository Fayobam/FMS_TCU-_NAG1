; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32doit-devkit-v1

[env:esp32doit-devkit-v1]
platform = https://github.com/pioarduino/platform-espressif32.git#51.03.04
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    mathieucarbou/ESPAsyncWebServer @ ^3.3.17
    bblanchon/ArduinoJson @ ^7.0.4
board_build.filesystem = spiffs

; ----------------------------------------------------------------------------
; HOST TEST ENV —  pio test -e native
; Compiles the control logic (scheduler + driver + cal + adaptation + DTC) against
; the shims in test/stubs/ and runs it on the PC. Deliberately EXCLUDES the
; hardware-bound units (main/WebManager/SpeedReader/InputManager): those need real
; peripherals and are bench-verified, not host-verified.
; `pio run` still builds only the ESP32 env (see default_envs above).
; ----------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    -<*>
    +<ShiftScheduler.cpp>
    +<SolenoidDriver.cpp>
    +<EngineProfile.cpp>
    +<AdaptiveMemory.cpp>
    +<DtcManager.cpp>
build_flags =
    -std=gnu++17
    -D UNIT_TEST
    -I src
    -I test/stubs